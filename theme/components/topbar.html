<!-- CubernixHosting Topbar -->

<header class="cubernix-topbar">

    <div class="cubernix-topbar-left">

        <div class="cubernix-topbar-brand">
            <img
                src="assets/cubernix-logo.png"
                alt="CubernixHosting"
            >

            <div>
                <h1 class="cubernix-topbar-title">
                    CubernixHosting
                </h1>

                <span class="cubernix-topbar-subtitle">
                    Hosting Panel
                </span>
            </div>
        </div>

    </div>

    <div class="cubernix-topbar-actions">

        <!-- Notifications -->
        <button
            class="cubernix-topbar-button"
            id="cubernix-notifications-button"
            type="button"
            aria-label="Notifications"
            title="Notifications"
        >
            🔔
        </button>

        <!-- More options -->
        <div class="cubernix-more-wrapper">

            <button
                class="cubernix-topbar-button"
                id="cubernix-more-button"
                type="button"
                aria-label="More options"
                aria-expanded="false"
                title="More options"
            >
                ⋮
            </button>

            <div
                class="cubernix-more-menu"
                id="cubernix-more-menu"
                hidden
            >

                <button
                    class="cubernix-more-item"
                    type="button"
                    data-action="settings"
                >
                    <span>⚙️</span>
                    <span>Settings</span>
                </button>

                <button
                    class="cubernix-more-item"
                    type="button"
                    data-action="background"
                >
                    <span>🎨</span>
                    <span>Background</span>
                </button>

                <button
                    class="cubernix-more-item"
                    type="button"
                    data-action="plugins"
                >
                    <span>🧩</span>
                    <span>Plugins</span>
                </button>

                <button
                    class="cubernix-more-item"
                    type="button"
                    data-action="versions"
                >
                    <span>📦</span>
                    <span>Versions</span>
                </button>

                <div class="cubernix-more-divider"></div>

                <button
                    class="cubernix-more-item danger"
                    type="button"
                    data-action="logout"
                >
                    <span>🚪</span>
                    <span>Logout</span>
                </button>

            </div>

        </div>

        <!-- User -->
        <button
            class="cubernix-user-button"
            type="button"
            aria-label="User account"
        >

            <span class="cubernix-user-avatar">
                U
            </span>

            <span class="cubernix-user-info">

                <span class="cubernix-user-name">
                    User
                </span>

                <span class="cubernix-user-role">
                    Client
                </span>

            </span>

        </button>

    </div>

</header>

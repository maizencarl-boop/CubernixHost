<!-- CubernixHosting Settings -->

<section
    class="cubernix-settings"
    id="cubernix-settings"
>

    <header class="cubernix-settings-header">

        <h2 class="cubernix-settings-title">
            Settings
        </h2>

        <p class="cubernix-settings-subtitle">
            Customize your CubernixHosting panel.
        </p>

    </header>


    <div class="cubernix-settings-grid">

        <!-- Appearance -->

        <article class="cubernix-settings-card">

            <div class="cubernix-settings-card-icon">
                🎨
            </div>

            <div class="cubernix-settings-card-content">

                <h3>
                    Appearance
                </h3>

                <p>
                    Customize the look and feel of your panel.
                </p>

            </div>

            <button
                type="button"
                class="cubernix-settings-card-button"
                data-setting="appearance"
            >
                Configure
            </button>

        </article>


        <!-- Background -->

        <article class="cubernix-settings-card">

            <div class="cubernix-settings-card-icon">
                🖼️
            </div>

            <div class="cubernix-settings-card-content">

                <h3>
                    Background
                </h3>

                <p>
                    Choose a custom background image for your panel.
                </p>

            </div>

            <button
                type="button"
                class="cubernix-settings-card-button"
                data-setting="background"
            >
                Configure
            </button>

        </article>


        <!-- Account -->

        <article class="cubernix-settings-card">

            <div class="cubernix-settings-card-icon">
                👤
            </div>

            <div class="cubernix-settings-card-content">

                <h3>
                    Account
                </h3>

                <p>
                    Manage your account and profile preferences.
                </p>

            </div>

            <button
                type="button"
                class="cubernix-settings-card-button"
                data-setting="account"
            >
                Configure
            </button>

        </article>


        <!-- Panel -->

        <article class="cubernix-settings-card">

            <div class="cubernix-settings-card-icon">
                ⚙️
            </div>

            <div class="cubernix-settings-card-content">

                <h3>
                    Panel

                </h3>

                <p>
                    Configure general CubernixHosting panel options.
                </p>

            </div>

            <button
                type="button"
                class="cubernix-settings-card-button"
                data-setting="panel"
            >
                Configure
            </button>

        </article>

    </div>

  </section>

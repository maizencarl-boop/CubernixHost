<!-- CubernixHosting Dashboard -->

<main class="cubernix-dashboard">

    <header class="cubernix-dashboard-header">
        <h1 class="cubernix-dashboard-title">
            Welcome to CubernixHosting
        </h1>

        <p class="cubernix-dashboard-subtitle">
            Manage your servers quickly and easily.
        </p>
    </header>

    <section class="cubernix-server-grid">

        <article class="cubernix-server-card">
            <h2 class="cubernix-server-name">
                Your Server
            </h2>

            <div class="cubernix-server-status offline">
                <span class="cubernix-status-dot"></span>
                Offline
            </div>
        </article>

        <article class="cubernix-server-card">
            <h2 class="cubernix-server-name">
                Create a Server
            </h2>

            <div class="cubernix-server-status">
                <span class="cubernix-status-dot"></span>
                Ready
            </div>
        </article>

    </section>

</main>

<!-- CubernixHosting Background Settings -->

<section class="cubernix-background-settings">

    <h2 class="cubernix-background-title">
        Panel Background
    </h2>

    <p class="cubernix-background-description">
        Choose an image from your device to use as your panel background.
        The image stays on your device and is applied locally.
    </p>

    <div class="cubernix-background-controls">

        <label
            class="cubernix-background-button"
            for="cubernix-background-input"
        >
            Choose Background
        </label>

        <input
            class="cubernix-background-input"
            id="cubernix-background-input"
            type="file"
            accept="image/png,image/jpeg,image/webp"
        >

        <button
            class="cubernix-background-button cubernix-background-reset"
            id="cubernix-background-reset"
            type="button"
        >
            Reset Background
        </button>

    </div>

</section>

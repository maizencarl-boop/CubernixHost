<!-- CubernixHosting Main Layout -->

<div class="cubernix-app">

    <!-- Mobile menu button -->
    <button
        class="cubernix-menu-button"
        id="cubernix-menu-button"
        type="button"
        aria-label="Open menu"
        aria-expanded="false"
    >
        ☰
    </button>

    <!-- Mobile overlay -->
    <div
        class="cubernix-sidebar-overlay"
        id="cubernix-sidebar-overlay"
    ></div>

    <!-- Sidebar -->
    <aside class="cubernix-sidebar">

        <!-- Branding -->
        <div class="cubernix-sidebar-logo">
            <img
                src="assets/cubernix-logo.png"
                alt="CubernixHosting"
            >
            <span>CubernixHosting</span>
        </div>

        <!-- Main navigation -->
        <div class="cubernix-sidebar-section">
            Main
        </div>

        <a href="#" class="cubernix-sidebar-item active">
            <span>⌂</span>
            <span>Dashboard</span>
        </a>

        <a href="#" class="cubernix-sidebar-item">
            <span>▣</span>
            <span>Servers</span>
        </a>

        <!-- Server navigation -->
        <div class="cubernix-sidebar-section">
            Server
        </div>

        <a href="#" class="cubernix-sidebar-item">
            <span>⚙</span>
            <span>Startup</span>
        </a>

        <a href="#" class="cubernix-sidebar-item">
            <span>⌘</span>
            <span>Network</span>
        </a>

        <a href="#" class="cubernix-sidebar-item">
            <span>▤</span>
            <span>Files</span>
        </a>

        <a href="#" class="cubernix-sidebar-item">
            <span>▦</span>
            <span>Databases</span>
        </a>

    </aside>

    <!-- Main content area -->
    <div class="cubernix-content">

        <!-- Top navigation -->
        <header class="cubernix-topbar">

            <h1 class="cubernix-topbar-title">
                CubernixHosting
            </h1>

            <div class="cubernix-topbar-actions">

                <button
                    class="cubernix-topbar-button"
                    type="button"
                    aria-label="Notifications"
                >
                    🔔
                </button>

                <button
                    class="cubernix-topbar-button"
                    type="button"
                    aria-label="More options"
                >
                    ⋮
                </button>

            </div>

        </header>

        <!-- Dashboard -->
        <main class="cubernix-dashboard">

            <header class="cubernix-dashboard-header">

                <h2 class="cubernix-dashboard-title">
                    Welcome to CubernixHosting
                </h2>

                <p class="cubernix-dashboard-subtitle">
                    Manage your servers quickly and easily.
                </p>

            </header>

            <!-- Server cards -->
            <section class="cubernix-server-grid">

                <article class="cubernix-server-card">

                    <h3 class="cubernix-server-name">
                        Your Server
                    </h3>

                    <div class="cubernix-server-status offline">
                        <span class="cubernix-status-dot"></span>
                        Offline
                    </div>

                </article>

                <article class="cubernix-server-card">

                    <h3 class="cubernix-server-name">
                        Create a Server
                    </h3>

                    <div class="cubernix-server-status">
                        <span class="cubernix-status-dot"></span>
                        Ready
                    </div>

                </article>

            </section>

        </main>

    </div>

</div>
